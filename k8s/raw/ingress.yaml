apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-tracker
  namespace: job-tracker
spec:
  ingressClassName: traefik
  rules:
    - host: jobtracker.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80