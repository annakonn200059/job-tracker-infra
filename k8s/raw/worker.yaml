apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: job-tracker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: job-tracker-worker:REPLACE_ME
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://jobtracker:localdev@postgres.job-tracker.svc.cluster.local:5432/jobtracker
            - name: LOG_LEVEL
              value: debug
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi