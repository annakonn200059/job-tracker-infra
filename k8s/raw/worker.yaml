apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: job-tracker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        checksum/config: CONFIG_HASH
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: job-tracker-worker:REPLACE_ME
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # $(DB_PASSWORD) is expanded by the kubelet at container start and must be
            # defined above this entry. The pod spec keeps the placeholder, so the
            # password never shows up in `kubectl get pod -o yaml`.
            - name: DATABASE_URL
              value: postgres://jobtracker:$(DB_PASSWORD)@postgres:5432/jobtracker
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi