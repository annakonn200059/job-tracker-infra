apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: job-tracker
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          env:
            - name: POSTGRES_USER
              value: jobtracker
            - name: POSTGRES_DB
              value: jobtracker
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
          volumeMounts:
            - name: postgres-secret
              mountPath: /run/secrets/postgres
              readOnly: true
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jobtracker", "-d", "jobtracker"]
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-secret
          secret:
            secretName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: job-tracker
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
