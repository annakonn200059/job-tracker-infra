apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: job-tracker
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          env:
            - name: POSTGRES_USER
              value: jobtracker
            - name: POSTGRES_DB
              value: jobtracker
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
          volumeMounts:
            - name: postgres-secret
              mountPath: /run/secrets/postgres
              readOnly: true
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-secret
          secret:
            secretName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: job-tracker
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
