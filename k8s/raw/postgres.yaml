apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: job-tracker
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: pgvector/pgvector:0.8.7-pg16
      env:
        - name: POSTGRES_USER
          value: jobtracker
        - name: POSTGRES_PASSWORD
          value: localdev
        - name: POSTGRES_DB
          value: jobtracker
      ports:
        - containerPort: 5432
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: job-tracker
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
