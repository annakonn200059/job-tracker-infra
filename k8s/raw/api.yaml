apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: job-tracker
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        checksum/config: CONFIG_HASH
    spec:
      containers:
        - name: api
          image: job-tracker-api:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: GOOGLE_CLIENT_ID
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://jobtracker:$(DB_PASSWORD)@postgres:5432/jobtracker?sslmode=disable
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            # /readyz pings the DB with a 2s timeout; the 1s default would fail first.
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: job-tracker
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
