apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: job-tracker
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        checksum/config: CONFIG_HASH
    spec:
      containers:
        - name: web
          image: job-tracker-web:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: web-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: job-tracker
spec:
  selector:
    app: web
  ports:
    - port: 80          # what clients and the Ingress use
      targetPort: 3000  # what the container listens on