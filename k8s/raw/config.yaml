apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: job-tracker
data:
  GOOGLE_CLIENT_ID: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: job-tracker
data:
  HTTP_PORT: "8080"
  LOG_LEVEL: debug
  COOKIE_SECURE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: job-tracker
data:
  API_INTERNAL_URL: http://api.job-tracker.svc.cluster.local:8080
  HOSTNAME: "0.0.0.0"
  # No landing service in the cluster yet, so unauthenticated users go to the
  # web app's own login page. Compose points this at the landing container.
  LANDING_URL: /login
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: job-tracker
data:
  LOG_LEVEL: debug
  POLL_INTERVAL: "5"
  SHUTDOWN_WAIT: "15"
